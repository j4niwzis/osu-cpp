<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>osu!cpp</title>
  <!-- Cross-origin isolation, without which a threaded build has no
       SharedArrayBuffer to run in. Absent when this file is opened straight
       out of a build directory, which is why it is asked for and not
       required. -->
  <script src="coi.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #111; }
    /* The element is sized here and nowhere else. How many pixels are behind
       it is the client's business: it reads this size every frame and sets
       the buffer to match, which is also what tells it to redraw. */
    #canvas { width: 100vw; height: 100vh; display: block; }
    #loading { position: absolute; top: 0; left: 0; width: 100%; height: 100%;
               display: flex; flex-direction: column; align-items: center;
               justify-content: center; color: #ccc; background: #111;
               font-family: sans-serif; font-size: 16px; z-index: 10; }
    #loading.hidden { display: none; }
    #loading h1 { font-size: 34px; margin-bottom: 10px; color: #fff; }
    #loading p { margin: 4px 0; color: #888; }
  </style>
</head>
<body>
  <div id="loading">
    <h1>osu!cpp</h1>
    <p id="loading-note">Loading…</p>
  </div>
  <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
  <!-- The picker the client asks for when the import button is pressed. -->
  <input id="beatmap-input" type="file" accept=".osz,.zip" multiple style="display:none">

  <script>
    var canvas = document.getElementById('canvas');
    var loading = document.getElementById('loading');
    var note = document.getElementById('loading-note');
    var beatmapInput = document.getElementById('beatmap-input');

    var Module = {
      canvas: canvas,
      // Beatmaps and skins are imported and downloaded inside the client, so
      // it starts with nothing to be told.
      arguments: [],
      print: function (text) { console.log(text); },
      // Through log rather than error: the client writes what it is doing
      // to stderr, and a browser answers every console.error with a stack
      // trace of the runtime, which buries the line it was printing.
      printErr: function (text) { console.log(text); },
      // What the runtime says, with its numbers made to mean one thing.
      //
      // The two it reports while a file arrives are different measures when
      // the server compresses it: what has been received is counted after
      // decompression, and the total is Content-Length, which is the
      // compressed size. Twenty-one megabytes of beatmap assets arriving as
      // twelve reads as "(17799341/12119431)" -- more than all of it. So a
      // total that has already been passed is not shown at all.
      setStatus: function (text) {
        if (!text) {
          return;
        }
        var parts = text.match(/^(.*?)\s*\((\d+)\/(\d+)\)$/);
        if (!parts) {
          note.textContent = text;
          return;
        }
        var loaded = parseInt(parts[2], 10);
        var total = parseInt(parts[3], 10);
        note.textContent = loaded <= total
          ? parts[1] + ' ' + Math.round(100 * loaded / total) + '%'
          : parts[1] + ' ' + (loaded / 1048576).toFixed(1) + ' MB';
      },
      onRuntimeInitialized: function () {
        loading.classList.add('hidden');
        canvas.focus();
      },
      // Called by the client, which hides the pointer while playing.
      setCursorVisible: function (visible) {
        canvas.style.cursor = visible ? 'default' : 'none';
      },
      // Called by the client when the import button in its menu is pressed.
      // A file input can only be opened from a user gesture, and a button
      // press is one -- the client is reacting to the same click.
      osuPickBeatmap: function () {
        beatmapInput.value = '';
        beatmapInput.click();
      },
    };

    // A C++ exception that escapes into JavaScript arrives as an object
    // holding a pointer. The runtime can say what it was, when the build
    // carries the helpers for it, so it is asked rather than left as
    // "uncaught CppException".
    window.addEventListener('error', function (event) {
      var thrown = event.error;
      if (!thrown || typeof thrown !== 'object' || !('excPtr' in thrown)) {
        return;
      }
      if (!Module.getExceptionMessage) {
        console.error('a C++ exception escaped, and this build cannot say what it was');
        return;
      }
      try {
        console.error('C++ exception: ' + Module.getExceptionMessage(thrown).join(': '));
      } catch (error) {
        console.error('a C++ exception escaped and could not be read: ' + error);
      }
    });

    // An audio context may not start until the page has been interacted
    // with, and the browser is the one keeping count.
    function resumeAudio() {
      if (Module.webaudioContext && Module.webaudioContext.state === 'suspended') {
        Module.webaudioContext.resume();
      }
    }
    // A browser refuses a pointer lock for about a second after Escape was
    // what released it, and Escape is how this game is paused: leaving the
    // pause menu asked for the lock, was refused, and nothing asked again --
    // so play carried on with a pointer that was never held. The next click
    // asks.
    canvas.addEventListener('mousedown', function () {
      if (Module.osuWantsPointer && document.pointerLockElement !== canvas &&
          canvas.requestPointerLock) {
        var asked = canvas.requestPointerLock();
        if (asked && asked.catch) {
          asked.catch(function () {});
        }
      }
    });
    canvas.addEventListener('mousedown', resumeAudio);
    canvas.addEventListener('touchstart', resumeAudio);

    // Where an imported archive is put: a name of its own each time, because
    // two files chosen at once are two imports and the client takes them a
    // frame apart.
    var importCount = 0;

    function importArchive(file) {
      var reader = new FileReader();
      reader.onload = function (event) {
        var path = '/import-' + (importCount++) + '.osz';
        try {
          Module.FS.writeFile(path, new Uint8Array(event.target.result));
        } catch (error) {
          console.error('import: ' + error);
          return;
        }
        Module.ccall('osu_import_archive', null, ['string'], [path]);
      };
      reader.onerror = function () {
        console.error('import: cannot read ' + file.name);
      };
      reader.readAsArrayBuffer(file);
    }

    function importFiles(files) {
      for (var i = 0; i < files.length; ++i) {
        importArchive(files[i]);
      }
    }

    beatmapInput.addEventListener('change', function (event) {
      importFiles(event.target.files);
    });

    // Dropping an archive on the window does the same thing, which is what
    // the desktop build does with a drop.
    window.addEventListener('dragover', function (event) { event.preventDefault(); });
    window.addEventListener('drop', function (event) {
      event.preventDefault();
      if (event.dataTransfer && event.dataTransfer.files.length > 0) {
        importFiles(event.dataTransfer.files);
      }
    });
  </script>
  {{{ SCRIPT }}}
</body>
</html>
