# The Ubuntu Touch package, cross-compiled.
#
# Clickable builds for the device's architecture inside a container and runs
# every compiler under qemu. Skia alone is two thousand objects; emulated,
# that does not finish inside the six hours a job gets. So this build does
# what the Android one does -- compiles for the target with a compiler that
# runs here -- and assembles the .click itself, which is a Debian package
# with a manifest in it.
name: click

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    # The same image as the native build, for the same reason: `import std`
    # needs libstdc++ 15, whose bits/std.cc is what a module manifest points
    # at, and 24.04 carries 14.
    runs-on: ubuntu-26.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: clang 22
        run: |
          sudo apt-get update || true
          sudo apt-get install -y ninja-build python3 pkg-config ccache \
            lsb-release software-properties-common gnupg curl \
            generate-ninja meson gperf dpkg-dev
          curl -fsSL https://apt.llvm.org/llvm.sh -o /tmp/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 22 all
          echo /usr/lib/llvm-22/bin >> "$GITHUB_PATH"

      # The device's architecture, as packages on this machine. dpkg keeps
      # them under the multiarch directories, so the sysroot is this
      # filesystem and nothing has to be emulated to read it.
      - name: the target's libraries
        run: |
          sudo dpkg --add-architecture arm64
          sudo tee /etc/apt/sources.list.d/arm64.sources > /dev/null <<'SOURCES'
          Types: deb
          URIs: http://ports.ubuntu.com/ubuntu-ports
          Suites: resolute resolute-updates
          Components: main universe
          Architectures: arm64
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          SOURCES
          # The archives this machine already reads carry amd64 and nothing
          # else, and asking them for arm64 is what makes apt-get update
          # fail: "Failed to fetch .../binary-arm64/Packages 404". They are
          # in deb822 format here, so the architecture is a field.
          for f in /etc/apt/sources.list.d/*.sources; do
            [ -f "$f" ] || continue
            grep -q '^Architectures:' "$f" || \
              sudo sed -i '/^Types: deb/a Architectures: amd64' "$f"
          done
          sudo apt-get update
          # Without the ones that drag glib: its -dev-bin packages are not
          # co-installable across architectures, and apt says so as unmet
          # dependencies rather than as a conflict. Neither is needed here --
          # sound goes through ALSA, and sd-bus comes from basu, which this
          # build compiles.
          # --allow-downgrades, because a package that is Multi-Arch: same
          # must be the same version on every architecture, and this image
          # carries amd64 packages newer than the archive it is built from.
          # Aligning them moves libc6 and libstdc++6 back to what the archive
          # has for both -- which is the version this build compiles against
          # anyway, and the compiler it uses comes from apt.llvm.org.
          sudo apt-get install -y --no-install-recommends --allow-downgrades \
            libc6-dev:arm64 libstdc++-15-dev:arm64 \
            libgl-dev:arm64 libegl-dev:arm64 libgles-dev:arm64 \
            libopengl-dev:arm64 libglx-dev:arm64 libglvnd-dev:arm64 \
            libwayland-dev:arm64 libxkbcommon-dev:arm64 \
            libx11-dev:arm64 libxrandr-dev:arm64 libxinerama-dev:arm64 \
            libxcursor-dev:arm64 libxi-dev:arm64 libasound2-dev:arm64 \
            libssl-dev:arm64

      # What the target's GL libraries actually are on disk. FindOpenGL
      # reported both missing after they were installed, and a listing is
      # the difference between a wrong search path and a wrong package.
      - name: where the target's GL is
        run: |
          ls -la /usr/lib/aarch64-linux-gnu/libOpenGL.so* \
                 /usr/lib/aarch64-linux-gnu/libGLX.so* \
                 /usr/lib/aarch64-linux-gnu/libEGL.so* 2>&1 || true

      # Where libstdc++ keeps the source of its std module. The file is the
      # same for every architecture -- it is C++ that includes headers -- and
      # which headers it reaches is decided by the sysroot of the compile,
      # which here is the target's.
      - name: what import std reads from libstdc++
        run: |
          std=$(ls /usr/include/c++/*/bits/std.cc | sort -V | tail -1)
          echo "std module source: $std"
          cat > /tmp/libstdc++.modules.json <<EOF
          {
            "version": 1,
            "revision": 1,
            "modules": [
              { "logical-name": "std", "source-path": "$std",
                "is-std-library": true },
              { "logical-name": "std.compat",
                "source-path": "${std%std.cc}std.compat.cc",
                "is-std-library": true }
            ]
          }
          EOF

      - name: cmake
        run: |
          version=4.3.4
          curl -sSL -o cmake.tar.gz \
            "https://github.com/Kitware/CMake/releases/download/v${version}/cmake-${version}-linux-x86_64.tar.gz"
          sudo tar xzf cmake.tar.gz -C /opt
          echo "/opt/cmake-${version}-linux-x86_64/bin" >> "$GITHUB_PATH"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/cmake-everywhere/sources
            ~/.cache/cmake-everywhere/store
            ~/.cache/ccache
          key: click-${{ hashFiles('cmake/get_cme.cmake') }}-${{ github.sha }}
          restore-keys: click-${{ hashFiles('cmake/get_cme.cmake') }}-

      - name: configure
        env:
          CCACHE_DIR: ~/.cache/ccache
        run: |
          cmake -S standalone -B build-click -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/cmake/toolchains/aarch64-linux-gnu.cmake" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang-22 \
            -DCMAKE_CXX_COMPILER=clang++-22 \
            -DCMAKE_CXX_STDLIB_MODULES_JSON=/tmp/libstdc++.modules.json \
            -DCME_STORE_ENABLED=ON \
            -DOSU_WAYLAND=ON \
            -DOPENGL_opengl_LIBRARY=/usr/lib/aarch64-linux-gnu/libOpenGL.so \
            -DOPENGL_glx_LIBRARY=/usr/lib/aarch64-linux-gnu/libGLX.so \
            -DOPENGL_INCLUDE_DIR=/usr/include \
            -DCMAKE_INSTALL_PREFIX=/

      - name: build
        env:
          CCACHE_DIR: ~/.cache/ccache
          NINJA_STATUS: "[%f/%t %es] "
        run: cmake --build build-click

      - name: what the build decided
        if: always()
        run: cat build-click/cme-report.txt || true

      - name: the package
        run: |
          stage=$(mktemp -d)
          install -Dm755 build-click/osu_client "$stage/osu_client"
          install -Dm644 click/manifest.json "$stage/manifest.json"
          install -Dm644 click/osu-cpp.apparmor "$stage/osu-cpp.apparmor"
          install -Dm644 click/osu-cpp.desktop "$stage/osu-cpp.desktop"
          install -Dm755 click/osu-cpp-launch "$stage/osu-cpp-launch"
          cp -a standalone/assets "$stage/assets"
          click/pack.sh "$stage" osu-cpp.click

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: osu-cpp-click
          path: osu-cpp.click
