# The Flatpak build.
#
# Every dependency is a module of the manifest, built into /app, and the
# client is configured with CME_OFFLINE: nothing is fetched, because a
# flatpak-builder module has no network. So this run answers a question the
# other builds cannot -- whether the ports can be answered entirely by a
# prefix that somebody else populated, which is what packaging for a
# distribution is.
name: flatpak

# A branch is built through its pull request, and main is built when
# something lands on it. Both triggers on every push meant every commit on a
# branch with a pull request open was built twice, identically.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One run of this workflow per branch at a time. A push that supersedes what
# is building makes the older run an answer about code nobody is waiting on,
# and these runs are long enough that eleven of them at once filled the
# twenty a free account may have.
#
# main is exempt: what landed there is worth an answer even if something
# lands on top of it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: flatpak and the runtime
        run: |
          sudo apt-get update || true
          sudo apt-get install -y flatpak flatpak-builder ccache
          flatpak remote-add --if-not-exists --user flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub \
            org.freedesktop.Platform//25.08 \
            org.freedesktop.Sdk//25.08 \
            org.freedesktop.Sdk.Extension.llvm22//25.08

      # What flatpak-builder downloaded and what it has already built. The
      # manifest is what decides both, so it is what the key is made of.
      #
      # Restored and saved as separate steps, because the saving is the point:
      # actions/cache writes in a post step and a cancelled job runs none, so
      # this build -- the long one, the one whose cache matters -- had never
      # written a cache at all. Saving after each stage means a push that
      # cancels this one still leaves behind everything it had built.
      - uses: actions/cache/restore@v4
        with:
          path: .flatpak-builder
          key: flatpak-${{ hashFiles('flatpak/io.github.j4niwzis.osu_cpp.yml') }}-${{ github.sha }}
          restore-keys: |
            flatpak-${{ hashFiles('flatpak/io.github.j4niwzis.osu_cpp.yml') }}-
            flatpak-

      # Everything this client is built against, and not the client. These
      # are the modules that take the hour: cmake, gn, boost, skia, ffmpeg.
      - name: the libraries
        run: |
          flatpak-builder --user --force-clean --disable-rofiles-fuse \
            --ccache --stop-at=osu-cpp build-flatpak \
            flatpak/io.github.j4niwzis.osu_cpp.yml

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .flatpak-builder
          key: flatpak-${{ hashFiles('flatpak/io.github.j4niwzis.osu_cpp.yml') }}-${{ github.sha }}-libraries

      # And the client, which is minutes rather than an hour.
      #
      # --force-clean again: it empties the directory the application is
      # assembled in, which the stage above left behind, and nothing else.
      # What that stage actually did is in .flatpak-builder/cache, an ostree
      # repository of built modules, and this run reads it rather than
      # building them a second time.
      - name: the client
        run: |
          flatpak-builder --user --force-clean --disable-rofiles-fuse \
            --ccache --repo=repo build-flatpak \
            flatpak/io.github.j4niwzis.osu_cpp.yml

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .flatpak-builder
          key: flatpak-${{ hashFiles('flatpak/io.github.j4niwzis.osu_cpp.yml') }}-${{ github.sha }}-client

      - name: what the build decided
        if: always()
        run: cat .flatpak-builder/build/osu-cpp*/build*/cme-report.txt || true

      # What is being kept, by part. A repository is given ten gigabytes of
      # cache in total and the least recently used entry is evicted to stay
      # under it, so a cache this size is not free to the other workflows:
      # it is what pushed the WebAssembly store out and made that build
      # compile Skia from the beginning again.
      - name: what the cache is made of
        if: always()
        run: du -sh .flatpak-builder/* 2>/dev/null | sort -h || true

      - name: bundle
        run: |
          flatpak build-bundle repo osu-cpp.flatpak io.github.j4niwzis.osu_cpp

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: osu-cpp-flatpak
          path: osu-cpp.flatpak
