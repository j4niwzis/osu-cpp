# The Guix build.
#
# Every library is a Guix package. Only the application's own skiff
# components remain pinned source inputs; the build cannot fetch or compile
# a fallback copy of a missing distribution library.
name: guix

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v6

      # The generated lock input now supplies only the two application
      # components that Guix cannot package on our behalf.
      - name: is there a list of sources
        id: sources
        run: |
          if [ -f guix/sources.scm ]; then
            echo "have=yes" >> "$GITHUB_OUTPUT"
          else
            echo "have=no" >> "$GITHUB_OUTPUT"
            echo "guix/sources.scm is not committed yet: the native run"
            echo "generates it and it has to be taken from there."
          fi

      # A hundred and thirty megabytes of a fixed version with a fixed
      # digest, so fetching it again every run is asking a mirror for
      # something we already have.
      - uses: actions/cache@v5
        if: steps.sources.outputs.have == 'yes'
        with:
          path: guix-binary-1.5.0.x86_64-linux.tar.xz
          key: guix-binary-1.5.0

      - name: guix
        if: steps.sources.outputs.have == 'yes'
        run: |
          # The installer fetches through ftpmirror.gnu.org, which is a
          # redirector, and the redirector has been answering 502. The
          # mirrors behind it are fine, so the tarball is fetched from one of
          # them here and the installer is handed it.
          #
          # Pinned, because this is binaries about to be run as root: a
          # mirror is a machine that is not GNU's, and the digest is what
          # makes which mirror answered not matter.
          version=1.5.0
          file=guix-binary-$version.x86_64-linux.tar.xz
          digest=aa41025489c5061543e9c48873eaa829b900b2da75d40f9648913622f5f47817
          if [ -f "$file" ] && echo "$digest  $file" | sha256sum -c - >/dev/null 2>&1
          then
            echo "already here, and it is the right one"
          else
            for mirror in https://ftp.gnu.org/gnu/guix \
                          https://mirrors.kernel.org/gnu/guix \
                          https://ftp.funet.fi/pub/gnu/prep/guix \
                          https://mirror.us-midwest-1.nexcess.net/gnu/guix; do
              echo "trying $mirror"
              if wget -q -O "$file" "$mirror/$file"; then
                break
              fi
            done
          fi
          echo "$digest  $file" | sha256sum -c - || {
            echo "what arrived is not what was asked for; stopping"
            exit 1
          }
          wget -q https://guix.gnu.org/install.sh
          # Newlines, not y: the installer says so itself, and says that
          # anything else is unsupported and likely to break.
          yes '' | sudo -E env GUIX_BINARY_FILE_NAME="$PWD/$file" \
            bash install.sh || {
            echo "Guix did not install. Nothing here was checked by this run."
            exit 1
          }
          echo "/var/guix/profiles/per-user/root/current-guix/bin" >> "$GITHUB_PATH"

      # The installer is only the bootstrap executable. The package set is
      # the exact Guix repository revision in channels.scm; this is new
      # enough to provide Skia and remains the same between runs.

      # git 2.52 stops before it starts when it cannot read the system
      # configuration -- "unable to access '/etc/gitconfig': Permission
      # denied", then "unknown error occurred while reading the
      # configuration files" -- and every source here is a checkout, so that
      # is every fetch. The file is readable by everyone on this machine and
      # is not readable inside the containers the daemon builds in, so it is
      # moved out of the way: no system configuration is a case git knows
      # how to be in.
      - name: git's system configuration, out of the way
        if: steps.sources.outputs.have == 'yes'
        run: |
          ls -l /etc/gitconfig || echo "there is none"
          sudo mv /etc/gitconfig /etc/gitconfig.not-for-this-run || true

      # A Guix archive carries the store database metadata and is signed by
      # the daemon that exported it. Restoring one through `guix archive` is
      # therefore safe in a way that copying /gnu/store with a file cache is
      # not. Only our expensive custom outputs are archived; ordinary Guix
      # packages continue to come from the project's substitute servers.
      - name: restore cached Guix packages
        id: guix-package-cache
        if: steps.sources.outputs.have == 'yes'
        uses: actions/cache/restore@v5
        with:
          path: .guix-package-cache
          key: guix-packages-${{ runner.os }}-${{ hashFiles('guix/channels.scm', 'guix/osu-cpp.scm', 'guix/sources.scm', 'cmake/get_cme.cmake') }}
          restore-keys: |
            guix-packages-${{ runner.os }}-

      - name: import cached Guix packages
        if: steps.sources.outputs.have == 'yes'
        run: |
          archive=.guix-package-cache/packages.nar.gz
          public_key=.guix-package-cache/signing-key.pub
          if [ ! -s "$archive" ] || [ ! -s "$public_key" ]; then
            echo "there is no completed Guix package archive to restore"
            exit 0
          fi
          sudo "$(command -v guix)" archive --authorize < "$public_key"
          gzip -dc "$archive" | guix archive --import

          # And what says that the pinned revision has already been built.
          #
          # The store now holds the Guix the time machine would produce, but
          # time-machine looks for it by asking git: it clones the channel to
          # resolve the commit, and that clone is twelve minutes of every run.
          # ~/.cache/guix/inferiors is the answer it keeps -- a link from the
          # channel revision to the profile in the store -- so restoring it
          # with the store contents is what makes the second run skip the
          # clone entirely.
          if [ -f .guix-package-cache/inferiors.tar ]; then
            mkdir -p ~/.cache/guix
            tar -xf .guix-package-cache/inferiors.tar -C ~/.cache/guix
            echo "the pinned Guix is already built, and this says where"
          fi

      - name: build
        if: steps.sources.outputs.have == 'yes'
        run: |
          guix time-machine -C guix/channels.scm -- \
            build -f guix/osu-cpp.scm --no-grafts -v2

      # A failed build's log is the daemon's, not the command's: guix prints
      # a path and stops. Without this the failure is a derivation name.
      - name: the log of whatever failed
        if: steps.sources.outputs.have == 'yes' && failure()
        run: |
          for log in $(sudo find /var/log/guix/drvs -name '*.gz' -newermt '-30 minutes'); do
            echo "=== $log"
            sudo zcat "$log" | tail -60
          done

      - name: what it produced
        if: steps.sources.outputs.have == 'yes' && success()
        run: |
          out=$(guix time-machine -C guix/channels.scm -- \
            build -f guix/osu-cpp.scm --no-grafts)
          ls -la "$out"/bin || true

      # Save completed custom outputs even when a later derivation fails.
      # This also includes the Guix produced by the pinned time-machine:
      # compiling that inferior accounted for twelve minutes of a cache-hit
      # run. The recursive archive includes every runtime reference.
      - name: prepare Guix package cache
        id: prepare-guix-package-cache
        if: steps.sources.outputs.have == 'yes' && always()
        run: |
          channel_revision=$(
            sed -n 's/.*(commit "\([0-9a-f]*\)").*/\1/p' guix/channels.scm
          )
          channel_version=${channel_revision:0:9}
          if [ -z "$channel_version" ]; then
            echo "could not read the pinned Guix revision"
            exit 1
          fi
          mapfile -t roots < <(
            find /gnu/store -maxdepth 1 -type d \
              \( -name '*-cmake-minimal-4.3.4' \
                 -o -name '*-osu-cpp-1.0.0' \
                 -o -name "*-guix-$channel_version" \) \
              -print | sort
          )
          if [ "${#roots[@]}" -eq 0 ]; then
            echo "no completed custom Guix packages to cache"
            echo "have=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p .guix-package-cache
          # The foreign-distribution installer only needs trusted substitute
          # keys, so it does not create a local archive-signing key. Generate
          # this runner's ephemeral key before exporting its completed work.
          if ! sudo test -s /etc/guix/signing-key.pub; then
            sudo "$(command -v guix)" archive --generate-key
          fi
          sudo cat /etc/guix/signing-key.pub \
            > .guix-package-cache/signing-key.pub
          guix archive --export --recursive "${roots[@]}" \
            | gzip -1 > .guix-package-cache/packages.nar.gz
          # The links that say which channel revision that Guix is, kept
          # beside it: without them the next run clones the channel again to
          # find out something it already has.
          if [ -d ~/.cache/guix/inferiors ]; then
            tar -cf .guix-package-cache/inferiors.tar -C ~/.cache/guix inferiors
          fi
          echo "have=yes" >> "$GITHUB_OUTPUT"
          ls -lh .guix-package-cache

      - name: save Guix package cache
        if: steps.prepare-guix-package-cache.outputs.have == 'yes' && always()
        uses: actions/cache/save@v5
        with:
          path: .guix-package-cache
          key: guix-packages-${{ runner.os }}-${{ hashFiles('guix/channels.scm', 'guix/osu-cpp.scm', 'guix/sources.scm', 'cmake/get_cme.cmake') }}
