# The Guix build.
#
# Every library is a Guix package. Only the application's own skiff
# components remain pinned source inputs; the build cannot fetch or compile
# a fallback copy of a missing distribution library.
name: guix

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v6

      # The generated lock input now supplies only the two application
      # components that Guix cannot package on our behalf.
      - name: is there a list of sources
        id: sources
        run: |
          if [ -f guix/sources.scm ]; then
            echo "have=yes" >> "$GITHUB_OUTPUT"
          else
            echo "have=no" >> "$GITHUB_OUTPUT"
            echo "guix/sources.scm is not committed yet: the native run"
            echo "generates it and it has to be taken from there."
          fi

      # A hundred and thirty megabytes of a fixed version with a fixed
      # digest, so fetching it again every run is asking a mirror for
      # something we already have.
      - uses: actions/cache@v5
        if: steps.sources.outputs.have == 'yes'
        with:
          path: guix-binary-1.5.0.x86_64-linux.tar.xz
          key: guix-binary-1.5.0

      - name: guix
        if: steps.sources.outputs.have == 'yes'
        run: |
          # The installer fetches through ftpmirror.gnu.org, which is a
          # redirector, and the redirector has been answering 502. The
          # mirrors behind it are fine, so the tarball is fetched from one of
          # them here and the installer is handed it.
          #
          # Pinned, because this is binaries about to be run as root: a
          # mirror is a machine that is not GNU's, and the digest is what
          # makes which mirror answered not matter.
          version=1.5.0
          file=guix-binary-$version.x86_64-linux.tar.xz
          digest=aa41025489c5061543e9c48873eaa829b900b2da75d40f9648913622f5f47817
          if [ -f "$file" ] && echo "$digest  $file" | sha256sum -c - >/dev/null 2>&1
          then
            echo "already here, and it is the right one"
          else
            for mirror in https://ftp.gnu.org/gnu/guix \
                          https://mirrors.kernel.org/gnu/guix \
                          https://ftp.funet.fi/pub/gnu/prep/guix \
                          https://mirror.us-midwest-1.nexcess.net/gnu/guix; do
              echo "trying $mirror"
              if wget -q -O "$file" "$mirror/$file"; then
                break
              fi
            done
          fi
          echo "$digest  $file" | sha256sum -c - || {
            echo "what arrived is not what was asked for; stopping"
            exit 1
          }
          wget -q https://guix.gnu.org/install.sh
          # Newlines, not y: the installer says so itself, and says that
          # anything else is unsupported and likely to break.
          yes '' | sudo -E env GUIX_BINARY_FILE_NAME="$PWD/$file" \
            bash install.sh || {
            echo "Guix did not install. Nothing here was checked by this run."
            exit 1
          }
          echo "/var/guix/profiles/per-user/root/current-guix/bin" >> "$GITHUB_PATH"

      # The installer is only the bootstrap executable. The package set is
      # the exact Guix repository revision in channels.scm; this is new
      # enough to provide Skia and remains the same between runs.

      # git 2.52 stops before it starts when it cannot read the system
      # configuration -- "unable to access '/etc/gitconfig': Permission
      # denied", then "unknown error occurred while reading the
      # configuration files" -- and every source here is a checkout, so that
      # is every fetch. The file is readable by everyone on this machine and
      # is not readable inside the containers the daemon builds in, so it is
      # moved out of the way: no system configuration is a case git knows
      # how to be in.
      - name: git's system configuration, out of the way
        if: steps.sources.outputs.have == 'yes'
        run: |
          ls -l /etc/gitconfig || echo "there is none"
          sudo mv /etc/gitconfig /etc/gitconfig.not-for-this-run || true

      # A Guix archive carries the store database metadata and is signed by
      # the daemon that exported it. Restoring one through `guix archive` is
      # therefore safe in a way that copying /gnu/store with a file cache is
      # not. Only our expensive custom outputs are archived; ordinary Guix
      # packages continue to come from the project's substitute servers.
      - name: restore cached Guix packages
        id: guix-package-cache
        if: steps.sources.outputs.have == 'yes'
        uses: actions/cache/restore@v5
        with:
          path: .guix-package-cache
          key: guix-packages-${{ runner.os }}-${{ hashFiles('guix/channels.scm') }}
          restore-keys: |
            guix-packages-${{ runner.os }}-

      - name: import cached Guix packages
        if: steps.sources.outputs.have == 'yes'
        run: |
          archive=.guix-package-cache/packages.nar.gz
          public_key=.guix-package-cache/signing-key.pub
          if [ ! -s "$archive" ] || [ ! -s "$public_key" ]; then
            echo "there is no completed Guix package archive to restore"
            exit 0
          fi
          sudo "$(command -v guix)" archive --authorize < "$public_key"
          gzip -dc "$archive" | guix archive --import

          # And what says that the pinned revision has already been built.
          #
          # The store now holds the Guix the time machine would produce, but
          # time-machine looks for it by asking git: it clones the channel to
          # resolve the commit, and that clone is twelve minutes of every run.
          # ~/.cache/guix/inferiors is the answer it keeps -- a link from the
          # channel revision to the profile in the store -- so restoring it
          # with the store contents is what makes the second run skip the
          # clone entirely.
          if [ -f .guix-package-cache/inferiors.tar ]; then
            mkdir -p ~/.cache/guix
            tar -xf .guix-package-cache/inferiors.tar -C ~/.cache/guix
            echo "the pinned Guix is already built, and this says where"
          fi

          # And said plainly as well, because a link into the store is a
          # thing that can be restored without what it points at, and a
          # store path either exists or does not.
          if [ -s .guix-package-cache/pinned-guix.txt ]; then
            pinned=$(cat .guix-package-cache/pinned-guix.txt)
            # Asked to say what it is, rather than taken at its word: a
            # store path can be there with something it needs missing, and
            # the answer to that is to build it, not to fail the run.
            if [ -x "$pinned/bin/guix" ] && "$pinned/bin/guix" --version; then
              echo "PINNED_GUIX=$pinned" >> "$GITHUB_ENV"
              echo "the pinned Guix is here: $pinned"
            else
              echo "the archive names $pinned, and it does not run from here"
            fi
          else
            # An archive written before this workflow started writing that
            # path down still holds the Guix; the store is asked directly.
            channel_revision=$(
              sed -n 's/.*(commit "\([0-9a-f]*\)").*/\1/p' guix/channels.scm
            )
            for candidate in $(
                find /gnu/store -maxdepth 1 -type d \
                  -name "*-guix-${channel_revision:0:9}*" | sort); do
              if [ -x "$candidate/bin/guix" ] && "$candidate/bin/guix" --version
              then
                echo "PINNED_GUIX=$candidate" >> "$GITHUB_ENV"
                echo "the pinned Guix was in what was restored: $candidate"
                break
              fi
            done
          fi

      # The clone of the channel, which is what the fifteen minutes are.
      #
      # time-machine resolves the pinned revision by updating its own copy of
      # the Guix repository and authenticating the commit chain from the
      # introduction, and that is a full clone of a large repository. The
      # revision is pinned, so the answer is the same every time; what
      # changes is only whether the copy is already here.
      #
      # Keyed on that revision: a run that moves the pin fetches once and
      # every run after it does not.
      - name: the channel, as it was cloned last time
        if: steps.sources.outputs.have == 'yes'
        uses: actions/cache@v5
        with:
          path: ~/.cache/guix/checkouts
          key: guix-checkout-${{ hashFiles('guix/channels.scm') }}
          restore-keys: guix-checkout-

      # The pinned Guix, called directly when it is already here.
      #
      # time-machine's job is to produce the Guix that guix/channels.scm
      # names, and it does that by cloning the channel and authenticating the
      # commit chain from the introduction -- fifteen minutes of a large
      # repository, every run, for an answer that a pinned revision makes the
      # same every time. Guix has no shallow or partial clone to offer here,
      # and it should not: what it is walking is a signature per commit.
      #
      # So the answer is kept instead of recomputed. The profile it produced
      # is in the archive this workflow restores, and the link that names it
      # is beside it; when both are here, that Guix is run directly and no
      # channel is consulted at all. When they are not -- a new pin, a cold
      # cache -- time-machine does its work and this run pays for it once.
      - name: build
        if: steps.sources.outputs.have == 'yes'
        run: |
          # Where the pinned Guix is: what the archive said, or failing
          # that whichever of the time machine's own links still points at
          # something.
          pinned="${PINNED_GUIX:-}"
          if [ -z "$pinned" ]; then
            for link in ~/.cache/guix/inferiors/*; do
              [ -e "$link" ] || continue
              candidate=$(readlink -f "$link")
              if [ -x "$candidate/bin/guix" ]; then
                pinned="$candidate"
                break
              fi
            done
          fi
          if [ -n "$pinned" ]; then
            echo "the pinned Guix is here already: $pinned"
            "$pinned/bin/guix" build -f guix/osu-cpp.scm --no-grafts -v2
          else
            echo "no pinned Guix here yet; the channel says which one it is"
            # Without authenticating thirteen thousand commits, which is
            # twelve minutes of this run. What that check answers is "is this
            # channel's history signed by people the introduction names", and
            # the answer is the same every time for a revision that is
            # pinned: what arrives is checked against the commit in
            # channels.scm either way. The run that builds this Guix is also
            # the run that caches it, so this is paid once per pin.
            guix time-machine --disable-authentication -C guix/channels.scm -- \
              build -f guix/osu-cpp.scm --no-grafts -v2
          fi

      # A failed build's log is the daemon's, not the command's: guix prints
      # a path and stops. Without this the failure is a derivation name.
      - name: the log of whatever failed
        if: steps.sources.outputs.have == 'yes' && failure()
        run: |
          for log in $(sudo find /var/log/guix/drvs -name '*.gz' -newermt '-30 minutes'); do
            echo "=== $log"
            sudo zcat "$log" | tail -60
          done

      - name: what it produced
        if: steps.sources.outputs.have == 'yes' && success()
        run: |
          if [ -n "${PINNED_GUIX:-}" ]; then
            out=$("$PINNED_GUIX/bin/guix" build -f guix/osu-cpp.scm --no-grafts)
          else
            out=$(guix time-machine --disable-authentication \
              -C guix/channels.scm -- build -f guix/osu-cpp.scm --no-grafts)
          fi
          ls -la "$out"/bin || true

      # Save completed custom outputs even when a later derivation fails.
      # This also includes the Guix produced by the pinned time-machine:
      # compiling that inferior accounted for twelve minutes of a cache-hit
      # run. The recursive archive includes every runtime reference.
      - name: prepare Guix package cache
        id: prepare-guix-package-cache
        if: steps.sources.outputs.have == 'yes' && always()
        run: |
          channel_revision=$(
            sed -n 's/.*(commit "\([0-9a-f]*\)").*/\1/p' guix/channels.scm
          )
          channel_version=${channel_revision:0:9}
          if [ -z "$channel_version" ]; then
            echo "could not read the pinned Guix revision"
            exit 1
          fi
          mapfile -t roots < <(
            find /gnu/store -maxdepth 1 -type d \
              \( -name '*-cmake-minimal-4.3.4' \
                 -o -name '*-osu-cpp-1.0.0' \
                 -o -name "*-guix-$channel_version" \) \
              -print | sort
          )
          # The profile the time machine built, which is what the link in
          # ~/.cache/guix/inferiors points at. Without it that link points
          # into a store that does not have it, and the next run goes back to
          # cloning the channel to find out what it already knows.
          for link in ~/.cache/guix/inferiors/*; do
            [ -e "$link" ] || continue
            roots+=("$(readlink -f "$link")")
          done
          if [ "${#roots[@]}" -eq 0 ]; then
            echo "no completed custom Guix packages to cache"
            echo "have=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p .guix-package-cache
          # The foreign-distribution installer only needs trusted substitute
          # keys, so it does not create a local archive-signing key. Generate
          # this runner's ephemeral key before exporting its completed work.
          if ! sudo test -s /etc/guix/signing-key.pub; then
            sudo "$(command -v guix)" archive --generate-key
          fi
          sudo cat /etc/guix/signing-key.pub \
            > .guix-package-cache/signing-key.pub
          guix archive --export --recursive "${roots[@]}" \
            | gzip -1 > .guix-package-cache/packages.nar.gz
          # The links that say which channel revision that Guix is, kept
          # beside it: without them the next run clones the channel again to
          # find out something it already has.
          if [ -d ~/.cache/guix/inferiors ]; then
            tar -cf .guix-package-cache/inferiors.tar -C ~/.cache/guix inferiors
          fi

          # Which store item is the Guix the pin names, written down.
          #
          # Not read from ~/.cache/guix/inferiors: the time machine leaves no
          # such directory here at all -- the runs that were supposed to
          # cache it saved an archive with nothing beside it, and every run
          # after them went back to cloning the channel. The store is where
          # the answer actually is, and the same find that collected the
          # roots above knows it.
          for candidate in "${roots[@]}"; do
            case "$candidate" in
              *-guix-"$channel_version"*) ;;
              *) continue ;;
            esac
            if [ -x "$candidate/bin/guix" ]; then
              echo "$candidate" > .guix-package-cache/pinned-guix.txt
              echo "the Guix this pin names is $candidate"
              break
            fi
          done
          if [ ! -s .guix-package-cache/pinned-guix.txt ]; then
            echo "no built Guix for $channel_version was found in the store;"
            echo "the next run will have to build it again"
          fi
          echo "have=yes" >> "$GITHUB_OUTPUT"
          ls -lh .guix-package-cache

      # Keyed on the pinned Guix revision and nothing else.
      #
      # It used to be keyed on the package definition, the source list and
      # the provider's pin as well -- all of which change most days -- so
      # every run wrote a new half-gigabyte cache under a new key. A
      # repository has ten gigabytes for all of them, so twenty such runs
      # evicted everything, including the hundred and thirty megabyte Guix
      # tarball and the archive holding the pinned Guix itself. The next run
      # then downloaded Guix again and spent twelve minutes authenticating
      # thirteen thousand commits to rebuild something it had built the day
      # before.
      #
      # What is in this cache is the Guix that guix/channels.scm names, and
      # that is what its key says. Our own outputs are in it too and are
      # simply rebuilt when they have changed, which is what the daemon is
      # for.
      - name: save Guix package cache
        if: steps.prepare-guix-package-cache.outputs.have == 'yes' && always()
        uses: actions/cache/save@v5
        with:
          path: .guix-package-cache
          key: guix-packages-${{ runner.os }}-${{ hashFiles('guix/channels.scm') }}
