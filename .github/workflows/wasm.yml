# The WebAssembly build.
#
# The client already has the platform files a browser needs -- the web
# runtime, the fetch transport, the capability answers -- and this is where
# they are compiled. Emscripten is a cross toolchain like any other here: it
# brings a compiler and a sysroot, and every library comes from a port built
# against them.
name: wasm

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: tools
        run: |
          sudo apt-get update || true
          sudo apt-get install -y ninja-build python3 pkg-config ccache \
            generate-ninja meson gperf

      - name: cmake
        run: |
          version=4.3.4
          curl -sSL -o cmake.tar.gz \
            "https://github.com/Kitware/CMake/releases/download/v${version}/cmake-${version}-linux-x86_64.tar.gz"
          sudo tar xzf cmake.tar.gz -C /opt
          echo "/opt/cmake-${version}-linux-x86_64/bin" >> "$GITHUB_PATH"

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/cmake-everywhere/sources
            ~/.cache/cmake-everywhere/store
            ~/.cache/ccache
          key: wasm-${{ hashFiles('cmake/get_cme.cmake') }}-${{ github.sha }}
          restore-keys: wasm-${{ hashFiles('cmake/get_cme.cmake') }}-

      # What the client reads at run time, packaged into the module's own
      # filesystem: it looks for fonts/<name> beside itself, and in a
      # browser "beside itself" is whatever was preloaded.
      #
      # All of them. The two CJK faces are twenty of these twenty-one
      # megabytes, and leaving them out is a page that draws Japanese titles
      # as empty boxes -- which is most of the titles.
      - name: what the client reads at run time
        run: |
          # All of assets, not the fonts alone: the licence of the skin this
          # offers to download is read from assets/licenses, and a build
          # without it shows "LICENCE FILE NOT FOUND" where the licence
          # should be -- in the dialog that asks you to accept it.
          #
          # Under assets/, which is where the client looks for both. Copying
          # it to the root as well doubled a twenty-one megabyte download for
          # a second spelling of the same files.
          mkdir -p /tmp/wasm-data/assets
          cp -a standalone/assets/. /tmp/wasm-data/assets/
          du -sh /tmp/wasm-data

      - name: configure
        env:
          CCACHE_DIR: ~/.cache/ccache
          CCACHE_MAXSIZE: 400M
        run: |
          # -pthread everywhere, because Skia is compiled that way by its
          # own configuration for WebAssembly, and a wasm object built for
          # shared memory does not link with one that was not. It is also
          # what makes <pthread.h> the answer for a library that asks
          # whether this platform has threads: without it Boost.Container
          # decided this was Windows and reached for __declspec.
          emcmake cmake -S standalone -B build-wasm -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="-pthread" \
            -DCMAKE_CXX_FLAGS="-pthread" \
            -DCMAKE_EXE_LINKER_FLAGS="-pthread" \
            -DWASM_PRELOAD_DATA=/tmp/wasm-data \
            -DCME_STORE_ENABLED=ON

      - name: build
        env:
          CCACHE_DIR: ~/.cache/ccache
          CCACHE_MAXSIZE: 400M
          NINJA_STATUS: "[%f/%t %es] "
        run: cmake --build build-wasm

      - name: what the build decided
        if: always()
        run: cat build-wasm/cme-report.txt || true

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: osu-cpp-wasm
          path: |
            build-wasm/*.js
            build-wasm/*.wasm
            build-wasm/*.data
            build-wasm/*.html
            standalone/coi.js
