# The Nix build.
#
# Every library is a nixpkgs package. CME resolves the same CMake graph as
# the other builds, but is forbidden to fall back to compiling a port.
name: nix

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  skia:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v6

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # GitHub's cache keeps the custom Skia build between ephemeral runners.
      # The source definitions form the immutable key; an older compatible
      # store is still useful when one of those definitions changes.
      - name: restore and save Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('nix/flake.nix', 'nix/sources.nix') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 8G

      - name: build Skia
        run: nix build ./nix#skia --print-build-logs

  build:
    needs: skia
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v6

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: restore cached Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('nix/flake.nix', 'nix/sources.nix') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          save: false

      - name: build
        run: nix build ./nix --print-build-logs

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: osu-cpp-nix
          path: result/bin/*
