# The Nix build.
#
# Every library is a nixpkgs package. CME resolves the same CMake graph as
# the other builds, but is forbidden to fall back to compiling a port.
name: nix

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: build
        run: nix build ./nix --print-build-logs

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: osu-cpp-nix
          path: result/bin/*
