# The build this project is developed with: a native Linux one, with every
# dependency answered by cmake-everywhere -- from the system where the system
# has it, and from a pinned source where it does not.
#
# It is the cheapest of the builds and the one that says the most: a change
# to a port, to an importer or to the client is visible here first, and in
# minutes.
name: native

# A branch is built through its pull request, and main is built when
# something lands on it. Both triggers on every push meant every commit on a
# branch with a pull request open was built twice, identically.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Called by the release workflow, which asks for the same build with
  # everything turned up: full link-time optimisation, -O3, and nothing left
  # in the binary that a user does not run.
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false
      # A second pass of the same build, to be compared with the first. It
      # writes its artifact under another name and compiles without the
      # compiler cache, so what is compared is two compilations and not one
      # compilation and a cache of it.
      suffix:
        type: string
        default: ""
      fresh:
        type: boolean
        default: false

# One run of this workflow per branch at a time. A push that supersedes what
# is building makes the older run an answer about code nobody is waiting on,
# and these runs are long enough that eleven of them at once filled the
# twenty a free account may have.
#
# main is exempt: what landed there is worth an answer even if something
# lands on top of it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    # 26.04 rather than whatever ubuntu-latest is today, because libskia
    # first appears there: 24.04 has no Skia to take, so the system run
    # would build it from source and prove nothing about taking it.
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      # What attesting a release artifact needs: a token that says which
      # workflow of which repository is asking, and the right to write the
      # answer into the public record.
      id-token: write
      attestations: write
    timeout-minutes: 360
    # The same sources, answered two ways.
    #
    #   system  the machine has the development packages, and every port
    #           that can be answered from them is. What a distribution
    #           packager gets.
    #   ports   nothing is taken from the machine, whatever it has. What
    #           somebody with an unusual system gets, and what the Android
    #           build already proves for one target.
    #
    # Both are claims this project makes, so both are tested. The report at
    # the end of each says which library came from where, and the difference
    # between the two reports is the answer to "what does this system
    # actually provide".
    strategy:
      fail-fast: false
      matrix:
        # A release is built from ports and from nothing else: what it ships
        # must be the same library on every machine, and "whatever this
        # distribution had" is the opposite of that. The ordinary run still
        # answers both questions.
        answer: ${{ fromJSON(inputs.release && '["ports"]' || '["system", "ports"]') }}
    name: build (${{ matrix.answer }})
    steps:
      - uses: actions/checkout@v4


      # Clang 22 and the distribution's libstdc++. The client is C++23
      # modules and import std, so the compiler has to be able to scan for
      # imports -- but which standard library it uses is not a free choice
      # here: every C++ library this machine has was built by g++ against
      # libstdc++, and a library compiled against the other one exports
      # different names for everything whose signature mentions a std type.
      - name: clang 22
        run: |
          sudo apt-get update || true
          # meson among them: a port whose upstream builds with meson is read
          # through meson, and basu is one. gn likewise, for Skia.
          sudo apt-get install -y ninja-build python3 pkg-config ccache \
            lsb-release software-properties-common gnupg curl \
            generate-ninja meson gperf
          curl -fsSL https://apt.llvm.org/llvm.sh -o /tmp/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 22 all
          echo /usr/lib/llvm-22/bin >> "$GITHUB_PATH"

      # Where libstdc++ keeps the source of its std module, as a manifest.
      #
      # libc++ ships one of these and libstdc++ does not, so the path is
      # found here rather than asked for: whichever version of the headers is
      # installed is the one that carries bits/std.cc.
      - name: what import std reads from libstdc++
        run: |
          std=$(ls /usr/include/c++/*/bits/std.cc | sort -V | tail -1)
          echo "std module source: $std"
          cat > /tmp/libstdc++.modules.json <<EOF
          {
            "version": 1,
            "revision": 1,
            "modules": [
              { "logical-name": "std", "source-path": "$std",
                "is-std-library": true },
              { "logical-name": "std.compat",
                "source-path": "${std%std.cc}std.compat.cc",
                "is-std-library": true }
            ]
          }
          EOF
          cat /tmp/libstdc++.modules.json

      # What a desktop build reaches through rather than builds: the window
      # system, the GPU stack and the sound server are the machine's, and
      # their headers have to be here for a port to find them.
      #
      # libgles-dev is separate from libegl-dev and from libgl-dev, and Skia
      # includes <GLES2/gl2.h> from the EGL interface it builds for the gl
      # feature. Without it the build stops seven hundred objects in, on a
      # header rather than on anything that says which library wanted it.
      - name: what the system provides
        run: |
          sudo apt-get install -y \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libxkbcommon-dev libwayland-dev wayland-protocols libgl-dev \
            libegl-dev libgles-dev libasound2-dev libpulse-dev libdbus-1-dev

      # Only for the run that is allowed to take them. Runner images carry
      # the runtime of most of these and the headers of almost none, which
      # is why a build here compiles things the machine appears to have.
      #
      # libzip's programs among them, and not because anything here runs
      # them: libzip-dev installs a CMake config that names /usr/bin/zipcmp
      # as an imported target, and Ubuntu ships that program as its own
      # package. Reading that config without it is a fatal error inside a
      # file this project does not own, so a machine with half of libzip
      # installed cannot configure at all.
      - name: what a machine with development packages has
        if: matrix.answer == 'system'
        run: |
          sudo apt-get install -y \
            zlib1g-dev libpng-dev libjpeg-dev libfreetype-dev libexpat1-dev \
            libsndfile1-dev libmpg123-dev libopenal-dev \
            libzip-dev \
            libvorbis-dev libogg-dev libflac-dev libopus-dev liblzma-dev \
            libharfbuzz-dev libsystemd-dev libglfw3-dev libboost-all-dev \
            libskia-dev
          # The programs libzip's CMake config declares as imported targets,
          # each its own package here. Separately, because which of the three
          # that config names is a property of the distribution's packaging
          # and not something to guess at.
          for tool in zipcmp zipmerge ziptool; do
            sudo apt-get install -y "$tool" || true
          done

      - name: cmake
        run: |
          version=4.3.4
          curl -sSL -o cmake.tar.gz \
            "https://github.com/Kitware/CMake/releases/download/v${version}/cmake-${version}-linux-x86_64.tar.gz"
          sudo tar xzf cmake.tar.gz -C /opt
          echo "/opt/cmake-${version}-linux-x86_64/bin" >> "$GITHUB_PATH"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/cmake-everywhere/sources
            ~/.cache/cmake-everywhere/store
            ~/.cache/ccache
          key: native-${{ matrix.answer }}${{ inputs.release && '-release' || '' }}-${{ hashFiles('cmake/get_cme.cmake') }}-${{ github.sha }}
          restore-keys: native-${{ matrix.answer }}${{ inputs.release && '-release' || '' }}-${{ hashFiles('cmake/get_cme.cmake') }}-

      - name: configure
        env:
          CCACHE_DIR: ${{ inputs.fresh && '/tmp/ccache-second-pass' || '~/.cache/ccache' }}
          CCACHE_MAXSIZE: 400M
        run: |
          # What a release adds, and nothing at all otherwise: the ordinary
          # run configures exactly as it always has.
          #
          # The _RELEASE variants, because a toolchain file sets CMAKE_C_FLAGS
          # and naming that variable here would replace what it set -- the
          # target and the sysroot among it. These are appended to it.
          extra=()
          if [ "${{ inputs.release }}" = "true" ]; then
            tuned="-O3 -DNDEBUG -flto=full -ffunction-sections -fdata-sections"
            linked="-flto=full -Wl,--gc-sections -Wl,-s"
            extra+=("-DCMAKE_C_FLAGS_RELEASE=$tuned")
            extra+=("-DCMAKE_CXX_FLAGS_RELEASE=$tuned")
            extra+=("-DCMAKE_EXE_LINKER_FLAGS_RELEASE=$linked")
            extra+=("-DCMAKE_SHARED_LINKER_FLAGS_RELEASE=$linked")
          fi
          cmake -S standalone -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang-22 \
            -DCMAKE_CXX_COMPILER=clang++-22 \
            -DCMAKE_CXX_FLAGS="-stdlib=libstdc++ -Wp,-U_FORTIFY_SOURCE" \
            -DCMAKE_CXX_STDLIB_MODULES_JSON=/tmp/libstdc++.modules.json \
            -DCME_STORE_ENABLED=ON \
            -DCME_SYSTEM=${{ matrix.answer == 'system' && 'AUTO' || 'NEVER' }} \
            "${extra[@]}"

      - name: build
        env:
          CCACHE_DIR: ${{ inputs.fresh && '/tmp/ccache-second-pass' || '~/.cache/ccache' }}
          CCACHE_MAXSIZE: 400M
          NINJA_STATUS: "[%f/%t %es] "
        run: cmake --build build

      # What a cancelled or failed run left in the store. The cache is
      # restored by the next run whatever happened to this one, so a
      # half-written entry outlives the build that abandoned it.
      - name: sweep the store
        if: always()
        run: |
          python3 build/_cme/tools/store-gc.py --unfinished --incomplete \
            --delete || true

      # Which library answered which find_package, and where each came from.
      - name: what the build decided
        if: always()
        run: |
          cat build/cme-report.txt || true
          # And what a kept module library says about itself, which is the
          # part a consumer reads to compile its interface units.
          for u in ~/.cache/cmake-everywhere/store/{skiff*,openal-soft}/*/use.cmake; do
            [ -f "$u" ] || continue
            echo "=== $u"
            cat "$u"
          done

      # The same list of libraries, in the spelling flatpak-builder reads.
      #
      # The lock is written by a build that had a network; a Flatpak module
      # has none, so what it may use has to be declared in the manifest.
      # These two files are generated from the lock and committed, the way a
      # Nix build's sources are.
      - name: what a Flatpak build would have to be given
        if: matrix.answer == 'ports'
        run: |
          python3 build/_cme/tools/lock-to-flatpak.py standalone/cme-lock.json \
            --sources flatpak/cme-sources.json --ports flatpak/cme-ports || true
          ls -la flatpak/cme-sources.json flatpak/cme-ports | head -30

      # And in the spelling Nix reads. The digest of a git checkout is of its
      # contents rather than of an archive, so this one needs the checkouts
      # the build made -- which is why it runs here and not anywhere else.
      - name: what a Nix build would have to be given
        if: matrix.answer == 'ports'
        run: |
          python3 build/_cme/tools/lock-to-nix.py standalone/cme-lock.json \
            ~/.cache/cmake-everywhere/sources > nix/sources.nix || true
          head -20 nix/sources.nix

      # And in the spelling Guix reads, which needs the same checkouts for
      # the same reason.
      - name: what a Guix build would have to be given
        if: matrix.answer == 'ports'
        run: |
          python3 build/_cme/tools/lock-to-guix.py standalone/cme-lock.json \
            ~/.cache/cmake-everywhere/sources > guix/sources.scm || true
          head -20 guix/sources.scm
          # A digest nobody could compute is written as an empty one, which
          # would be a build that fails on the first library rather than a
          # file that says what is missing.
          if grep -q 'base32 ""' guix/sources.scm; then
            echo "some sources have no digest yet:"
            grep -B 6 'base32 ""' guix/sources.scm | grep '(list "' || true
          fi

      - uses: actions/upload-artifact@v4
        if: matrix.answer == 'ports'
        with:
          name: generated-sources${{ inputs.suffix }}
          path: |
            flatpak/cme-sources.json
            flatpak/cme-ports
            nix/sources.nix
            guix/sources.scm
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: osu-cpp-linux-${{ matrix.answer }}${{ inputs.suffix }}
          path: |
            build/osu_client
            build/cme-report.txt

      # What this run built, bound to this workflow at this commit and
      # recorded in a public log. `gh attestation verify <file> --repo
      # j4niwzis/osu-cpp` answers from that record.
      #
      # Only for a release: an ordinary run builds the same thing and nobody
      # downloads it.
      - name: attest what this built
        if: ${{ inputs.release && success() }}
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            build/osu_client

