# Everything a release is made of, built the way a release is built.
#
# The ordinary workflows answer "does this still build, and what did it
# decide"; they are run on every change and they are built to be quick about
# it. This one answers a different question -- what somebody downloads -- and
# it is allowed to be slow: every target is compiled at -O3 with full
# link-time optimisation, and what comes out carries no symbol table.
#
# Each job is the ordinary workflow for that target, asked for with
# release: true. There is one description of how each target is built, and
# this is not a second one.
name: release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

# A release run is not superseded by the next one: two tags are two releases.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# What the Android job needs to attest where its package came from. A called
# workflow gets no more than its caller was given.
permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  # From ports and from nothing the machine happens to have: what is shipped
  # has to be the same library everywhere.
  native:
    uses: ./.github/workflows/native.yml
    with:
      release: true

  wasm:
    uses: ./.github/workflows/wasm.yml
    with:
      release: true

  click:
    uses: ./.github/workflows/click.yml
    with:
      release: true

  apk:
    uses: ./.github/workflows/android.yml
    with:
      release: true
    secrets: inherit

  # And all of it a second time.
  #
  # A build that cannot be repeated is a build nobody else can check: the
  # point of naming every source by digest and every archive by what built it
  # is that somebody with the same inputs gets the same bytes. This is that
  # claim, tested rather than asserted. The second pass compiles without the
  # compiler cache, so what is compared is two compilations rather than one
  # compilation and a cache of it.
  native-again:
    uses: ./.github/workflows/native.yml
    with:
      release: true
      suffix: "-again"
      fresh: true

  wasm-again:
    uses: ./.github/workflows/wasm.yml
    with:
      release: true
      suffix: "-again"
      fresh: true

  click-again:
    uses: ./.github/workflows/click.yml
    with:
      release: true
      suffix: "-again"
      fresh: true

  apk-again:
    uses: ./.github/workflows/android.yml
    with:
      release: true
      suffix: "-again"
      fresh: true
    secrets: inherit

  static:
    uses: ./.github/workflows/static.yml

  static-again:
    uses: ./.github/workflows/static.yml
    with:
      suffix: "-again"
      fresh: true

  flatpak:
    uses: ./.github/workflows/flatpak.yml
    with:
      release: true

  flatpak-again:
    uses: ./.github/workflows/flatpak.yml
    with:
      release: true
      suffix: "-again"
      fresh: true

  # What the two passes made, compared.
  #
  # The APK is compared unsigned. A run with no keystore signs with a test
  # key it generates for itself, and two such keys are two different
  # signatures over identical content -- so the signed files differ for a
  # reason that says nothing about the build. The unsigned package is what
  # this workflow attests, and it is what is compared.
  reproducible:
    needs: [native, native-again, wasm, wasm-again, click, click-again, apk, apk-again, flatpak, flatpak-again, static, static-again]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: passes

      - name: what the two passes made
        run: |
          find passes -type f | sort | while read -r file; do
            printf '%s  %s\n' "$(sha256sum "$file" | cut -d" " -f1)" "$file"
          done

      - name: and whether it is the same
        run: |
          differs=0
          compare() {
            first="$1"
            second="$2"
            if [ ! -f "$first" ] || [ ! -f "$second" ]; then
              echo "missing: $first or $second"
              differs=1
              return
            fi
            if cmp -s "$first" "$second"; then
              echo "same: $first"
            else
              echo "DIFFERS: $first"
              ls -l "$first" "$second"
              differs=1
            fi
          }
          compare passes/osu-cpp-linux-ports/osu_client \
                  passes/osu-cpp-linux-ports-again/osu_client
          compare passes/osu-cpp-wasm/build-wasm/osu_client.wasm \
                  passes/osu-cpp-wasm-again/build-wasm/osu_client.wasm
          compare passes/osu-cpp-wasm/build-wasm/osu_client.data \
                  passes/osu-cpp-wasm-again/build-wasm/osu_client.data
          compare passes/osu-cpp-click/osu-cpp.click \
                  passes/osu-cpp-click-again/osu-cpp.click
          compare passes/osu-cpp-android/osu-cpp-unsigned.apk \
                  passes/osu-cpp-android-again/osu-cpp-unsigned.apk
          # A Flatpak bundle is a nondeterministically compressed transport
          # for an immutable OSTree commit. Compare the commit IDs: equal IDs
          # mean every file and all of its metadata are equal.
          compare passes/osu-cpp-flatpak/osu-cpp.flatpak.commit \
                  passes/osu-cpp-flatpak-again/osu-cpp.flatpak.commit
          # The static build, which is the one where reproducibility is
          # hardest to hold: it contains LLVM, Mesa and every driver, all
          # optimised across the whole program at once.
          compare passes/osu-cpp-static/osu_client \
                  passes/osu-cpp-static-again/osu_client
          exit "$differs"

  # And what was built for the browser becomes the page.
  #
  # The branch is what GitHub Pages serves, so publishing is a commit on it
  # -- the same five files every time, taken from the run that just made
  # them rather than from a build somebody did by hand.
  page:
    needs: wasm
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: page

      - uses: actions/download-artifact@v4
        with:
          name: osu-cpp-wasm
          path: built

      - name: what the page serves
        run: |
          cp built/build-wasm/osu_client.js .
          cp built/build-wasm/osu_client.wasm .
          cp built/build-wasm/osu_client.data .
          cp built/build-wasm/osu_client.html index.html
          cp built/standalone/coi.js .
          ls -l index.html coi.js osu_client.js osu_client.wasm osu_client.data

      - name: publish
        run: |
          git config user.name j4niwzis
          git config user.email j4niwzis@proton.me
          git add -A
          if git diff --cached --quiet; then
            echo "the page already serves this build"
            exit 0
          fi
          git commit -m "The release build, as the page serves it Built by the release workflow from ${{ github.sha }}."
          git push
