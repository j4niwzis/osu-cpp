# Everything a release is made of, built the way a release is built.
#
# The ordinary workflows answer "does this still build, and what did it
# decide"; they are run on every change and they are built to be quick about
# it. This one answers a different question -- what somebody downloads -- and
# it is allowed to be slow: every target is compiled at -O3 with full
# link-time optimisation, and what comes out carries no symbol table.
#
# Each job is the ordinary workflow for that target, asked for with
# release: true. There is one description of how each target is built, and
# this is not a second one.
name: release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

# A release run is not superseded by the next one: two tags are two releases.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# What the Android job needs to attest where its package came from. A called
# workflow gets no more than its caller was given.
permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  # From ports and from nothing the machine happens to have: what is shipped
  # has to be the same library everywhere.
  native:
    uses: ./.github/workflows/native.yml
    with:
      release: true

  wasm:
    uses: ./.github/workflows/wasm.yml
    with:
      release: true

  click:
    uses: ./.github/workflows/click.yml
    with:
      release: true

  apk:
    uses: ./.github/workflows/android.yml
    with:
      release: true
    secrets: inherit

  # The one build that is not in the ordinary CI at all: an hour of a runner
  # and six gigabytes of cache, answering a question that does not change
  # from commit to commit.
  flatpak:
    uses: ./.github/workflows/flatpak.yml
    with:
      release: true

  # And what was built for the browser becomes the page.
  #
  # The branch is what GitHub Pages serves, so publishing is a commit on it
  # -- the same five files every time, taken from the run that just made
  # them rather than from a build somebody did by hand.
  page:
    needs: wasm
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: page

      - uses: actions/download-artifact@v4
        with:
          name: osu-cpp-wasm
          path: built

      - name: what the page serves
        run: |
          cp built/build-wasm/osu_client.js .
          cp built/build-wasm/osu_client.wasm .
          cp built/build-wasm/osu_client.data .
          cp built/build-wasm/osu_client.html index.html
          cp built/standalone/coi.js .
          ls -l index.html coi.js osu_client.js osu_client.wasm osu_client.data

      - name: publish
        run: |
          git config user.name j4niwzis
          git config user.email j4niwzis@proton.me
          git add -A
          if git diff --cached --quiet; then
            echo "the page already serves this build"
            exit 0
          fi
          git commit -m "The release build, as the page serves it

Built by the release workflow from ${{ github.sha }}."
          git push
