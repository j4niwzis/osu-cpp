<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>osu!cpp</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #111; }
    #canvas { width: 100vw !important; height: 100vh !important; display: block; }
    #drop-zone { position: absolute; top: 0; left: 0; width: 100%; height: 100%;
                 display: flex; flex-direction: column; align-items: center; justify-content: center;
                 color: #ccc; font-family: sans-serif; font-size: 18px; z-index: 10;
                 background: rgba(0,0,0,0.85); }
    #drop-zone.hidden { display: none; }
    #drop-zone h1 { font-size: 36px; margin-bottom: 12px; color: #fff; }
    #drop-zone p { margin: 6px 0; }
    #drop-zone .row { display: flex; gap: 16px; margin-top: 16px; }
    #drop-zone label { display: inline-block; padding: 12px 32px;
                       color: #fff; border-radius: 6px; cursor: pointer;
                       font-size: 16px; }
    #drop-zone .btn-beatmap { background: #e0689b; }
    #drop-zone .btn-beatmap:hover { background: #f078ab; }
    #drop-zone .btn-skin { background: #68a0e0; }
    #drop-zone .btn-skin:hover { background: #78b0f0; }
    #drop-zone input[type=file] { display: none; }
    #status { position: absolute; top: 12px; left: 12px; color: #ccc; font-family: sans-serif;
              font-size: 14px; z-index: 20; }
  </style>
</head>
<body>
  <div id="drop-zone">
    <h1>osu!cpp</h1>
    <p>Drop a <strong>.osz</strong> beatmap file here</p>
    <div class="row">
      <label for="beatmap-input" class="btn-beatmap">Choose beatmap</label>
      <label for="skin-input" class="btn-skin">Choose skin (.osk)</label>
    </div>
    <p style="font-size:14px; color:#888;">Skin is optional — fallback shapes used otherwise</p>
    <input type="file" id="beatmap-input" accept=".osz,.zip">
    <input type="file" id="skin-input" accept=".osk,.zip">
  </div>
  <div id="status"></div>
  <script>
    var canvas = document.createElement('canvas');
    canvas.id = 'canvas';
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    document.body.appendChild(canvas);

    var Module = {
      canvas: canvas,
      arguments: [],
      print: function(text) { console.log(text); },
      printErr: function(text) { console.error(text); },
      onRuntimeInitialized: function() {
        function resumeAudio() {
          if (Module.webaudioContext && Module.webaudioContext.state === 'suspended') {
            Module.webaudioContext.resume();
          }
        }
        canvas.addEventListener('mousedown', resumeAudio);
        canvas.addEventListener('click', resumeAudio);

        function syncCanvasSize() {
          canvas.width = window.innerWidth;
          canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', syncCanvasSize);

        var hiddenCursor = false;
        Module.setCursorVisible = function(visible) {
          hiddenCursor = !visible;
          canvas.style.cursor = visible ? 'default' : 'none';
          if (!visible) canvas.requestPointerLock();
          else document.exitPointerLock();
        };
      },
    };

    var dropZone = document.getElementById('drop-zone');
    var statusEl = document.getElementById('status');
    var beatmapInput = document.getElementById('beatmap-input');
    var skinInput = document.getElementById('skin-input');

    var skinReady = false;
    var beatmapReady = false;

    function tryStart() {
      if (!beatmapReady) return;
      if (!skinReady) {
        statusEl.textContent = 'Starting (no skin)...';
        dropZone.classList.add('hidden');
        Module.callMain(['--beatmap', '/beatmap.osz']);
        return;
      }
      statusEl.textContent = 'Extracting skin...';
      var result = Module._extractSkin();
      if (result !== 0) {
        statusEl.textContent = 'Skin extraction failed, starting without skin...';
        dropZone.classList.add('hidden');
        Module.callMain(['--beatmap', '/beatmap.osz']);
        return;
      }
      statusEl.textContent = 'Starting...';
      dropZone.classList.add('hidden');
      Module.callMain(['--beatmap', '/beatmap.osz', '--skin', '/skin']);
    }

    function loadOsk(file) {
      statusEl.textContent = 'Loading skin: ' + file.name + '...';
      var reader = new FileReader();
      reader.onload = function(ev) {
        var data = new Uint8Array(ev.target.result);
        FS.writeFile('/skin.osk', data);
        statusEl.textContent = 'Skin loaded.';
        skinReady = true;
        tryStart();
      };
      reader.onerror = function() { statusEl.textContent = 'Failed to read skin file.'; };
      reader.readAsArrayBuffer(file);
    }

    function loadOsz(file) {
      statusEl.textContent = 'Loading beatmap: ' + file.name + '...';
      var reader = new FileReader();
      reader.onload = function(ev) {
        var data = new Uint8Array(ev.target.result);
        FS.writeFile('/beatmap.osz', data);
        beatmapReady = true;
        tryStart();
      };
      reader.onerror = function() { statusEl.textContent = 'Failed to read beatmap file.'; };
      reader.readAsArrayBuffer(file);
    }

    beatmapInput.addEventListener('change', function(e) {
      if (e.target.files[0]) loadOsz(e.target.files[0]);
    });

    skinInput.addEventListener('change', function(e) {
      if (e.target.files[0]) loadOsk(e.target.files[0]);
    });

    dropZone.addEventListener('dragover', function(e) { e.preventDefault(); });
    dropZone.addEventListener('drop', function(e) {
      e.preventDefault();
      var file = e.dataTransfer.files[0];
      if (!file) return;
      if (file.name.endsWith('.osk')) {
        loadOsk(file);
      } else if (file.name.endsWith('.osz') || file.name.endsWith('.zip')) {
        loadOsz(file);
      }
    });
  </script>
  <script async type="text/javascript" src="osu_client.js"></script>
</body>
</html>
